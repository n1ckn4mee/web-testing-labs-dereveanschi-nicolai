<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Local Study Shop 2.0</title><style>body{font:20px Arial;margin:30px auto;max-width:1050px;color:#18222d;background:#f5f7f9}header{padding:18px;background:#16394a;color:white}h1,.title{font-size:28px;display:block;margin:20px 0}input,button{font:20px Arial;padding:10px;margin:10px 5px}label{display:block}.inventory_list{display:grid;grid-template-columns:1fr 1fr;gap:15px}.inventory_item{padding:18px;border:1px solid #abb9c1;background:white}.inventory_item_name{font-weight:bold}.inventory_item_price{margin:12px 0}a{color:#0369a1;cursor:pointer}.shopping_cart_badge{background:#a21c35;color:white;border-radius:20px;padding:5px}h3[data-test=error]{color:#a21c35}section{background:white;padding:24px}.meta{font-size:15px;color:#52606d}</style></head><body><header>Local Study Shop 2.0 — локальное учебное приложение</header><p class="meta">Только вымышленные данные. Эта модель создана для лабораторных и не является Sauce Demo.</p><main id="app"></main><script>
const A=document.querySelector('#app');const path=location.pathname;let state;
async function post(url,data){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.json()}
function err(t){document.querySelector('[data-test=error]')?.remove();let e=document.createElement('h3');e.dataset.test='error';e.textContent=t;A.appendChild(e)}
function cartlink(){return `<a class="shopping_cart_link" data-test="shopping-cart-link" href="/cart.html">Your Cart ${state.cart.length?'<span class="shopping_cart_badge">'+state.cart.length+'</span>':''}</a>`}
function names(){return state.items.filter(x=>state.cart.includes(x.id)).map(x=>`<div class="cart_item"><div class="inventory_item_name">${x.name}</div><p>$${x.price.toFixed(2)}</p></div>`).join('')}
async function render(){state=await(await fetch('/api/state')).json();if(path==='/checkboxes'){A.innerHTML='<h1>Checkboxes</h1><form id="checkboxes"><input type="checkbox"> checkbox 1<br><input type="checkbox" checked> checkbox 2</form>';return}
if(path==='/form-validation'){A.innerHTML='<h1>Form validation fixture</h1><input id="validationCustom05" name="contactnumber"><input id="validationCustom05" name="postcode">';return}
if(path==='/'||path==='/login.html'){A.innerHTML='<div class="login_logo">Учебный магазин</div><h1>Login</h1><form id="login"><label>Username<input id="user-name" data-test="username"></label><label>Password<input id="password" data-test="password" type="password"></label><input id="login-button" type="submit" value="Login"></form>';document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let r=await post('/api/login',{user:document.querySelector('#user-name').value,password:document.querySelector('#password').value});if(r.error)err(r.error);else location.href='/inventory.html'};return}
if(!state.authenticated){location.href='/';return}
if(path==='/inventory.html'){A.innerHTML=cartlink()+'<span class="title">Products</span><div class="inventory_list">'+state.items.map(x=>`<div class="inventory_item"><div class="inventory_item_name catalog-name">${x.name}</div><div class="inventory_item_price">$${x.price.toFixed(2)}</div><button id="add-to-cart-${x.id}" data-test="add-to-cart-${x.id}" data-id="${x.id}">Add to cart</button></div>`).join('')+'</div>';document.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{await post('/api/cart',{action:'add',id:b.dataset.id});await render()});return}
if(path==='/cart.html'){A.innerHTML=cartlink()+'<span class="title">Your Cart</span>'+names()+'<button id="checkout">Checkout</button>';document.querySelector('#checkout').onclick=()=>location.href='/checkout-step-one.html';return}
if(path==='/checkout-step-one.html'){A.innerHTML=cartlink()+'<span class="title">Checkout: Your Information</span><form id="info"><input id="first-name" placeholder="First Name"><input id="last-name" placeholder="Last Name"><input id="postal-code" placeholder="Postal Code"><button id="continue">Continue</button></form>';document.querySelector('#info').onsubmit=async e=>{e.preventDefault();let r=await post('/api/checkout',{first:document.querySelector('#first-name').value,last:document.querySelector('#last-name').value,code:document.querySelector('#postal-code').value});if(r.error)err(r.error);else location.href='/checkout-step-two.html'};return}
if(path==='/checkout-step-two.html'){let sum=state.items.filter(x=>state.cart.includes(x.id)).reduce((s,x)=>s+x.price,0);A.innerHTML=cartlink()+'<span class="title">Checkout: Overview</span>'+names()+`<p>Item total: $${sum.toFixed(2)}</p><p>Tax: $${(sum*.08).toFixed(2)}</p><p class="summary_total_label">Total: $${(sum*1.08).toFixed(2)}</p><button id="finish">Finish</button>`;document.querySelector('#finish').onclick=async()=>{await post('/api/finish',{});location.href='/checkout-complete.html'};return}
if(path==='/checkout-complete.html')A.innerHTML=cartlink()+'<span class="title">Checkout: Complete!</span><h2 class="complete-header">Thank you for your order!</h2>';
}render();</script></body></html>
